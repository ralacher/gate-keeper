server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue SPA — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to Home Assistant REST API
    location /ha-api/ {
        rewrite ^/ha-api/(.*) /$1 break;
        proxy_pass ${HA_BASE_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse proxy to go2rtc (video feed + WebRTC)
    location /go2rtc/ {
        rewrite ^/go2rtc/(.*) /$1 break;
        proxy_pass ${GO2RTC_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Email endpoint — reads Cloudflare Access header
    location = /api/me {
        default_type application/json;
        return 200 '{"email":"$http_cf_access_authenticated_user_email"}';
    }

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
